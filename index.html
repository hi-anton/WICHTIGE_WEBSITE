<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antons Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: black;
        }

        .text,
        .header {
            font-family: Oswald;
            color: rgb(0, 220, 255);
            margin-left: 30px;
            transition: 0.135s;
            padding: 5px;
            display: inline-block;
        }

        .text:hover,
        .header:hover {
            padding-top: 8px;
            padding-bottom: 2px;
            text-shadow: 0px 0px 8px rgb(0, 220, 255);
        }

        .header {
            font-weight: bold;
            font-size: 70px;
        }

        .text {
            font-size: 18px;
        }

        .header-cont,
        .text-cont {
            display: block;
        }
    </style>
</head>

<body>
    <div>
        <div class="header-cont">
            <h1 class="header">
                fb.fredima.de
            </h1>
        </div>
        <div class="text-cont">
            <p class="text">
                Der deutlich bessere Teil des fredima.de Netzwerks
            </p>
        </div>
    </div>
</body>

</html>
