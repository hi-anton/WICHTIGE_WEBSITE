<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fb.fredima.de</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
            background: black;
            margin: 0;
        }

        .blink-text-menu {
            display: flex;
            flex-direction: column;
            list-style-type: none;
            padding: 0;
            margin-left: 30px;
        }

        .blink-text-menu li a {
            position: relative;
            display: inline-flex;
            padding: 6px;
            color: rgb(0, 220, 255);
            font-family: Oswald;
            text-decoration: none;
            overflow: hidden;
            font-size: 17px;
        }

        .blink-text-menu li a span {
            position: relative;
            display: inline-flex;
            overflow: hidden;
            transition: transform 0.6s ease, opacity 0.6s ease;
            white-space: pre;
        }

        .blink-text-menu li a span .out,
        .blink-text-menu li a span .in {
            display: inline-flex;
            white-space: pre;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        .blink-text-menu li a span .in {
            position: absolute;
            left: 0;
            opacity: 0;
            transform: translateX(100%);
            display: inline-flex;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        .blink-text-menu li a:hover span .out {
            opacity: 0;
            transform: translateX(-100%);
        }

        .blink-text-menu li a:hover span .in {
            opacity: 1;
            transform: translateX(0);
        }

        .text,
        .header {
            font-family: Oswald;
            color: rgb(0, 220, 255);
            margin-left: 30px;
            transition: 0.135s;
            padding: 5px;
            display: inline-block;
        }

        .text:hover,
        .header:hover {
            padding-top: 8px;
            padding-bottom: 2px;
            text-shadow: 0px 0px 8px rgb(0, 220, 255);
        }

        .header {
            font-weight: bold;
            font-size: 70px;
        }

        .text {
            font-size: 18px;
        }

        .header-cont,
        .text-cont {
            display: block;
        }
    </style>
</head>

<body>
    <div>
        <div class="header-cont">
            <h1 class="header">
                fb.fredima.de
            </h1>
        </div>
        <div>
            <ul class="blink-text-menu">
                <li><a>Der deutlich bessere Teil des fredima.de Netzwerks</a></li>
                <li><a href="https://fredima.de">&rarr; Zu fredima.de</a></li>
            </ul>
        </div>
    </div>
    <script>
        let blinkTextMenuLinks = document.querySelectorAll(".blink-text-menu li a");
        blinkTextMenuLinks.forEach(link => {
            let letters = link.textContent.split("");
            link.textContent = "";
            letters.forEach((letter, i) => {
                i += 1;
                let span = document.createElement("span");
                let delay = i / 20;
                if (i % 2 === 0) {
                    delay -= 0.1;
                } else {
                    delay += 0.05;
                }
                let letterOut = document.createElement("span");
                let displayLetter = letter === " " ? "\u00A0" : letter;
                letterOut.textContent = displayLetter;
                letterOut.style.transitionDelay = `${delay}s`;
                letterOut.classList.add("out");
                span.append(letterOut);
                let letterIn = document.createElement("span");
                letterIn.textContent = displayLetter;
                letterIn.style.transitionDelay = `${delay}s`;
                letterIn.classList.add("in");
                span.append(letterIn);
                link.append(span);
            });
        });
    </script>
</body>

</html>
